name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    env:
      MIX_ENV: test
      # config/test.exs reads these to reach the Postgres service below.
      DB_HOST: localhost
      DB_PORT: "5432"
      # CI runs a single stock Postgres, so the Oban repo shares it (locally it
      # defaults to the dedicated oban-postgres on 5434). Safe here because this
      # server has no TimescaleDB planner hooks to slow the small Oban pool.
      DB_OBAN_PORT: "5432"

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: homelab
          POSTGRES_PASSWORD: homelab
          POSTGRES_DB: homelab_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U homelab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
        with:
          # `mix credo diff` resolves the merge base against origin/main, so the
          # default depth-1 checkout is not enough — it needs real history.
          fetch-depth: 0

      - name: Set up Elixir/OTP
        id: beam
        uses: erlef/setup-beam@v1
        with:
          # Keep in sync with the Dockerfile build stage.
          otp-version: "28.3.3"
          elixir-version: "1.19.5"

      - name: Cache deps and _build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          # OTP/Elixir versions are part of the key: _build and Dialyzer PLTs are
          # compiled per-OTP, so a version bump must never restore stale artifacts
          # (including via restore-keys) into a run on the new toolchain.
          key: ${{ runner.os }}-otp${{ steps.beam.outputs.otp-version }}-elixir${{ steps.beam.outputs.elixir-version }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-otp${{ steps.beam.outputs.otp-version }}-elixir${{ steps.beam.outputs.elixir-version }}-mix-

      - name: Install dependencies
        run: mix deps.get

      - name: Check formatting
        run: mix format --check-formatted

      - name: Check for unused deps
        run: mix deps.unlock --check-unused

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      # BLOCKING. Gates on issues this branch INTRODUCES rather than on the
      # absolute count, because the codebase carries a ~315-issue backlog that
      # no single PR should be made to pay off. `credo diff` compares against
      # the merge base, so a branch fails only for what it added — which is the
      # signal worth acting on. Clearing the backlog lowers this to a plain
      # `mix credo --strict`.
      - name: Credo (new issues fail the build)
        run: mix credo diff --from-git-merge-base origin/main --strict

      # Advisory: prints the full backlog so it stays visible while it shrinks.
      - name: Credo backlog (advisory)
        if: always()
        run: mix credo --strict || true

      - name: Run tests
        run: mix test
