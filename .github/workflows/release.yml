name: Release

# Build and publish the container image to GHCR whenever a GitHub Release is
# published (which also creates the version tag). `workflow_dispatch` allows a
# manual rebuild/push of the current ref.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  # ghcr.io/<owner>/<repo> — already lowercase for this repo.
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    name: Build & push image to GHCR
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # From a release tag like `v1.2.3`: publishes 1.2.3, 1.2, and 1, plus
          # `latest`. Manual runs fall back to the short commit SHA.
          #
          # `latest` used to be gated on `github.event_name == 'release'`, which is
          # never true here: this workflow triggers on `push: tags` and
          # `workflow_dispatch`, and publishing a GitHub Release fires the tag PUSH
          # event, not `release`. So the condition was always false and `latest` was
          # NEVER published — while docker-compose.prod.yml defaults to
          # `${HOMELAB_IMAGE_TAG:-latest}`. Every install on the default tag was
          # pinned to whatever `latest` happened to be, and `docker compose pull`
          # could not move it.
          #
          # `flavor: latest=auto` is the action's own rule for this and gets the
          # prerelease case right without a hand-written condition: it tags `latest`
          # for a semver tag and withholds it for one carrying a prerelease component
          # (`v1.2.3-rc1`), which a bare `startsWith(github.ref, ...)` would not.
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          # linux/amd64 only by default (matches the typical server host). To
          # also publish arm64, add `platforms: linux/amd64,linux/arm64` and a
          # `docker/setup-qemu-action@v3` step above — note arm64 builds are
          # emulated and considerably slower.
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Single-arch image without the extra provenance manifest entry.
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
